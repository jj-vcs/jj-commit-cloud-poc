[package]
name = "jj-commit-cloud-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "jj"
path = "src/main.rs"

[dependencies]

jj-lib = { git = "https://github.com/jj-vcs/jj.git", tag = "v0.43.0" }
jj-cli = { git = "https://github.com/jj-vcs/jj.git", tag = "v0.43.0" }
clap = { version = "4.6.1", features = ["derive", "deprecated", "wrap_help", "string"] }
dunce = "1.0.5"
tokio = { version = "1.39.2", features = ["full"] }
tracing = "0.1.40"

[dev-dependencies]
assert_cmd = "2.0.14"
tempfile = "3.10.1"

[[test]]
name = "test_sqlite"
path = "tests/test_sqlite.rs"

