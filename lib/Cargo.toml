[package]
name = "jj-commit-cloud-lib"
version = "0.1.0"
edition = "2024"

[dependencies]
jj-lib = { git = "https://github.com/jj-vcs/jj.git", tag = "v0.43.0" }

rusqlite = { version = "0.32", features = ["bundled"] }
async-trait = "0.1.89"
futures = "0.3.32"
